name: Build Prebuilt Basalt (sm_120, DeepSeek-V4.1-Flash)

on:
  workflow_dispatch:
    inputs:
      basalt_tag:
        description: "Basalt git tag/ref to build (empty = read basalt_colab/vm/manifest.json)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "basalt_colab/vm/manifest.json"
      - "basalt_colab/vm/patch_basalt.py"
      - "basalt_colab/vm/abliterate.c"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout (shallow history for diff)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide whether prebuilt binaries need rebuilding
        id: decide
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess

          event = os.environ.get("EVENT_NAME", "")
          if event == "workflow_dispatch":
              print("should_build=true")
              raise SystemExit(0)

          before = os.environ.get("BEFORE_SHA", "")
          after = os.environ.get("AFTER_SHA", "HEAD")
          if not before or set(before) == {"0"}:
              print("should_build=true")
              raise SystemExit(0)

          # Ensure base commit is reachable (falls back to HEAD~1 if needed)
          r = subprocess.run(["git", "cat-file", "-e", f"{before}^{{commit}}"], capture_output=True)
          base = before if r.returncode == 0 else "HEAD~1"
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only", base, after], text=True).splitlines()
          )
          if "basalt_colab/vm/patch_basalt.py" in changed or "basalt_colab/vm/abliterate.c" in changed:
              print("should_build=true")
              raise SystemExit(0)
          if "basalt_colab/vm/manifest.json" in changed:
              old_raw = subprocess.check_output(["git", "show", f"{base}:basalt_colab/vm/manifest.json"], text=True)
              old_m = json.loads(old_raw)
              new_m = json.load(open("basalt_colab/vm/manifest.json"))
              keys = ("basalt_repo", "basalt_tag", "basalt_commit")
              if any(old_m.get(k) != new_m.get(k) for k in keys):
                  print("should_build=true")
                  raise SystemExit(0)
          print("should_build=false")
          EOF
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

  build-sm120:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - name: Checkout basalt-colab
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git cmake ninja-build python3 gcc g++ curl

      - name: Read manifest & clone Basalt
        id: meta
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open("basalt_colab/vm/manifest.json"))
          tag = os.environ.get("INPUT_TAG") or m["basalt_tag"]
          print(f"tag={tag}")
          print(f"repo={m['basalt_repo']}")
          print(f"commit={'' if os.environ.get('INPUT_TAG') else m['basalt_commit']}")
          EOF
        env:
          INPUT_TAG: ${{ inputs.basalt_tag }}

      - name: Clone & patch Basalt
        run: |
          git clone --depth 1 --branch "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.repo }}" /tmp/basalt
          if [ -n "${{ steps.meta.outputs.commit }}" ]; then
            test "$(git -C /tmp/basalt rev-parse HEAD)" = "${{ steps.meta.outputs.commit }}"
          fi
          python3 basalt_colab/vm/patch_basalt.py /tmp/basalt

      - name: Build Basalt (sm_120, deepseek41) + standalone abliterate
        run: |
          cmake -S /tmp/basalt -B /tmp/basalt/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=120 \
            -DBASALT_MODELS=deepseek41 \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/basalt/build -j "$(nproc)" --target basalt
          mkdir -p /tmp/dist/bin
          cp /tmp/basalt/bin/basalt /tmp/dist/bin/basalt
          gcc -O3 -fopenmp -DABLITERATE_STANDALONE basalt_colab/vm/abliterate.c -lm -o /tmp/dist/abliterate
          strip /tmp/dist/bin/basalt /tmp/dist/abliterate || true

      - name: Package tarball & SHA-256
        id: pkg
        run: |
          NAME="basalt-${{ steps.meta.outputs.tag }}-deepseek41-sm120-linux-x64.tar.gz"
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -cf - -C /tmp/dist bin/basalt abliterate | gzip -n > "/tmp/$NAME"
          SHA=$(sha256sum "/tmp/$NAME" | awk '{print $1}')
          echo "$SHA  $NAME" > "/tmp/$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Packaged $NAME (sha256: $SHA)"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-${{ steps.meta.outputs.tag }}
          name: Prebuilt Basalt ${{ steps.meta.outputs.tag }} (Colab G4 sm_120)
          body: |
            Patched `jesdga95/basalt` `${{ steps.meta.outputs.tag }}` (`-DBASALT_MODELS=deepseek41`, `sm_120`) + standalone `abliterate` binary for Google Colab G4.

            - Archive: `${{ steps.pkg.outputs.name }}`
            - SHA-256: `${{ steps.pkg.outputs.sha256 }}`
          files: |
            /tmp/${{ steps.pkg.outputs.name }}
            /tmp/${{ steps.pkg.outputs.name }}.sha256
