name: Test Suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-matrix:
    name: Unit & CLI (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (zero third-party deps)
        run: python -m pip install --no-build-isolation --no-deps -e . || python -m pip install --no-deps -e .
      - name: Compile check
        run: python -m compileall -q basalt_colab tests
      - name: Run cross-platform unit tests
        run: python -m unittest tests/test_config.py -v
      - name: Verify CLI entrypoint & packaged assets
        shell: python
        run: |
          import subprocess, sys
          from basalt_colab.console import render_console_html
          html = render_console_html()
          assert b"/_control/events" in html, "console.html asset missing or outdated"
          r_ver = subprocess.run([sys.executable, "-m", "basalt_colab", "--version"], capture_output=True, text=True)
          assert r_ver.returncode == 0 and "basalt-colab" in r_ver.stdout, r_ver.stdout + r_ver.stderr
          r_help = subprocess.run([sys.executable, "-m", "basalt_colab", "up", "--help"], capture_output=True, text=True)
          assert r_help.returncode == 0 and "--quant" in r_help.stdout, r_help.stdout + r_help.stderr
          r_bad = subprocess.run([sys.executable, "-m", "basalt_colab", "up", "--qunat", "ud-iq2_xxs"], capture_output=True, text=True)
          assert r_bad.returncode == 2, f"expected exit 2 on unknown flag, got {r_bad.returncode}: {r_bad.stderr}"

  integration-linux:
    name: Full Lifecycle Integration & Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax check (VM scripts)
        run: bash -n basalt_colab/vm/*.sh
      - name: Console HTML inline JS syntax check
        run: |
          node -e '
            const fs = require("fs"), vm = require("vm");
            const html = fs.readFileSync("basalt_colab/web/console.html", "utf8");
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) throw new Error("missing <script> tag");
            new vm.Script(m[1]);
            console.log("console.html JS syntax OK (" + m[1].length + " chars)");
          '
      - name: Run full unittest suite (unit + offline proxy/lifecycle integration)
        run: python -m unittest discover -s tests -v
