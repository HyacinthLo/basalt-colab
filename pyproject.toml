[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt-colab"
version = "0.3.0"
description = "Uncensored DeepSeek-V4.1-Flash on Google Colab G4 powered by Basalt v0.5.7 — OpenAI/Anthropic gateway and unified Web Control Console."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["basalt", "deepseek", "colab", "blackwell", "llm", "openai", "anthropic"]

[project.urls]
Homepage = "https://github.com/HyacinthLo/basalt-colab"
Repository = "https://github.com/HyacinthLo/basalt-colab"
Issues = "https://github.com/HyacinthLo/basalt-colab/issues"

[project.scripts]
basalt-colab = "basalt_colab.cli:main"

[tool.setuptools.packages.find]
include = ["basalt_colab*"]

[tool.setuptools.package-data]
basalt_colab = ["vm/*", "web/*"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["basalt_colab/vm"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E701"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["basalt_colab/vm/"]

